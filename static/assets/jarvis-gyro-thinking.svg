<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="36" height="36" id="jarvis-gyro-thinking">
  <!-- Jarvis Orbital Mind | Compact Thinking / Loading Gyro (Smooth 30fps, 2.4s cycle) -->
  <defs>
    <linearGradient id="jtMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4afff"/>
      <stop offset="50%" stop-color="#635bff"/>
      <stop offset="100%" stop-color="#4434d4"/>
    </linearGradient>
    <linearGradient id="jtGimbal" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#635bff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="jtSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b84ff"/>
    </linearGradient>
    <radialGradient id="jtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b84ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#635bff" stop-opacity="0"/>
    </radialGradient>
    <style>
      #jarvis-gyro-thinking .gyro-outer,
      #jarvis-gyro-thinking .gyro-inner,
      #jarvis-gyro-thinking .gyro-core,
      #jarvis-gyro-thinking .gyro-glow {
        transform-origin: 32px 32px;
        will-change: transform, opacity;
      }
      /* 2.4s cycle quantized to 72 steps = exact 30fps cadence */
      #jarvis-gyro-thinking .gyro-outer {
        animation: jtOuterSpin 2.4s steps(72, end) infinite;
      }
      #jarvis-gyro-thinking .gyro-inner {
        animation: jtInnerPrecess 2.4s steps(72, end) infinite;
      }
      #jarvis-gyro-thinking .gyro-core {
        animation: jtCoreBreathe 2.4s steps(72, end) infinite;
      }
      #jarvis-gyro-thinking .gyro-glow {
        animation: jtGlowPulse 2.4s steps(72, end) infinite;
      }
      @keyframes jtOuterSpin {
        0%   { transform: rotate(0deg) scale(1); }
        50%  { transform: rotate(180deg) scale(1.03); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes jtInnerPrecess {
        0%   { transform: rotate(0deg) scaleY(1); opacity: 0.55; }
        25%  { transform: rotate(-90deg) scaleY(0.84); opacity: 0.88; }
        50%  { transform: rotate(-180deg) scaleY(1.04); opacity: 0.65; }
        75%  { transform: rotate(-270deg) scaleY(0.84); opacity: 0.92; }
        100% { transform: rotate(-360deg) scaleY(1); opacity: 0.55; }
      }
      @keyframes jtCoreBreathe {
        0%, 100% { transform: scale(0.92); opacity: 0.85; }
        50%      { transform: scale(1.12); opacity: 1; }
      }
      @keyframes jtGlowPulse {
        0%, 100% { transform: scale(0.9); opacity: 0.55; }
        50%      { transform: scale(1.18); opacity: 0.95; }
      }
      @media (prefers-reduced-motion: reduce) {
        #jarvis-gyro-thinking * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Dark Studio Squircle -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0b0b0d"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#1f1f24" stroke-width="1.5"/>

  <!-- Compact Ambient Glow -->
  <circle class="gyro-glow" cx="32" cy="32" r="15" fill="url(#jtGlow)"/>

  <!-- Inner Counter-Precessing Gimbal Ring -->
  <g class="gyro-inner">
    <ellipse cx="32" cy="32" rx="11.2" ry="4.6" transform="rotate(32 32 32)" fill="none" stroke="url(#jtGimbal)" stroke-width="1.6"/>
  </g>

  <!-- Primary Outer Gyro Ring + Satellite -->
  <g class="gyro-outer">
    <ellipse cx="32" cy="32" rx="14.6" ry="6.2" transform="rotate(-28 32 32)" fill="none" stroke="url(#jtMain)" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="44.9" cy="25.1" r="1.85" fill="#e4dfff"/>
  </g>

  <!-- Compact Luminous AI Core -->
  <circle class="gyro-core" cx="32" cy="32" r="4.3" fill="url(#jtSoft)"/>
</svg>
